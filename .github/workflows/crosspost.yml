name: Untappd to Pixelfed
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python untappd_to_pixelfed.py
        env:
          UNTAPPD_RSS_URL: ${{ secrets.UNTAPPD_RSS_URL }}
          PIXELFED_INSTANCE: ${{ secrets.PIXELFED_INSTANCE }}
          PIXELFED_TOKEN: ${{ secrets.PIXELFED_TOKEN }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet state.json || (git add state.json && git commit -m "Update seen checkins" && git push)
